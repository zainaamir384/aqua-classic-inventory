{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block page_title %}Edit Profile Info{% endblock %}
{% block title %}Edit Profile Info{% endblock %}

{% block content %}
<section class="page-shell">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card shadow-lg p-4">
        <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom-muted">
          <h1 class="h4 text-white mb-0">✏️ Edit Profile Info</h1>
          <a href="{% url 'accounts:profile' %}" class="btn btn-xs btn-outline-secondary">← Back to Profile</a>
        </div>

        <form method="post">
          {% csrf_token %}
          {{ form|crispy }}
          <div class="d-flex justify-content-end gap-2 mt-4">
            <a href="{% url 'accounts:profile' %}" class="btn btn-sm btn-secondary">Cancel</a>
            <button class="btn btn-sm btn-primary" type="submit">✓ Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}
